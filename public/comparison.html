<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breaker Comparison — Dirisdigiware</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08090F;--card:#0E1220;--card2:#121828;--inp:#141B2A;
  --border:#1A2540;--text:#EEF0F8;--muted:#5A6488;--sub:#8892B0;
  --teal:#00C8D4;--gold:#C9A347;--red:#E05555;--green:#4CAF7D;
  --purple:#8B6FE8;--orange:#E8924F;--pink:#E86FA8;--blue:#4F9EE8;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

/* TOPBAR */
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.brand{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:var(--teal)}
.brand span{color:#fff}
.topbar-r{display:flex;align-items:center;gap:8px}
.nav-btn{background:transparent;border:1px solid var(--border);border-radius:7px;padding:5px 12px;font-size:12px;color:var(--muted);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;transition:all .15s;font-family:'Inter',sans-serif}
.nav-btn:hover{border-color:var(--teal);color:var(--teal)}
.co-pill{background:rgba(0,200,212,.08);border:1px solid rgba(0,200,212,.2);border-radius:20px;padding:4px 12px;font-size:11px;color:var(--teal);font-weight:500}

/* CONTROLS */
.controls{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ctrl-lbl{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.dt{background:var(--inp);border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:12px;color:var(--text);outline:none;font-family:'Inter',sans-serif}
.dt:focus{border-color:var(--teal)}
.sep{width:1px;height:24px;background:var(--border)}
.pb{background:var(--inp);border:1px solid var(--border);border-radius:7px;padding:5px 12px;font-size:11px;color:var(--muted);cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.pb:hover,.pb.active{background:rgba(0,200,212,.1);border-color:var(--teal);color:var(--teal)}
.grp-sel{background:var(--inp);border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:12px;color:var(--text);outline:none;font-family:'Inter',sans-serif}
.btn-load{background:linear-gradient(135deg,#009AA5,var(--teal));border:none;border-radius:7px;padding:6px 18px;font-size:12px;font-weight:700;color:#000;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.btn-load:hover{opacity:.88}

/* MAIN */
.main{flex:1;padding:20px 24px;display:flex;flex-direction:column;gap:16px}

/* KPI ROW */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kpi-label{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.kpi-val{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;line-height:1}
.kpi-sub{font-size:9px;color:var(--muted);margin-top:3px}

/* CHART CARDS */
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;position:relative}
.chart-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,var(--teal),transparent)}
.chart-title{font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;color:var(--teal);margin-bottom:4px}
.chart-sub{font-size:10px;color:var(--muted);margin-bottom:14px}
.chart-wrap{position:relative;height:260px}

/* FULL WIDTH CARD */
.chart-full{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;position:relative}
.chart-full::before{content:'';position:absolute;top:0;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.chart-full .chart-title{color:var(--gold)}
.chart-full .chart-wrap{height:280px}

/* BREAKER TABLE */
.tbl-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.tbl-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1.5px}
.tbl-title{font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;color:var(--sub);margin-bottom:14px}
table{width:100%;border-collapse:collapse}
th{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
td{font-size:12px;color:var(--sub);padding:9px 12px;border-bottom:1px solid rgba(26,37,64,.5)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(0,200,212,.03)}
.td-name{font-weight:600;color:var(--text)}
.td-kwh{font-family:'JetBrains Mono',monospace;color:var(--teal)}
.td-cost{font-family:'JetBrains Mono',monospace;color:var(--gold)}
.td-pct{font-size:10px;color:var(--muted)}
.bar-mini{height:4px;border-radius:2px;margin-top:4px;background:var(--border);overflow:hidden}
.bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--teal),#0AF)}

/* LOADING */
.loading{text-align:center;padding:60px;color:var(--muted);font-size:13px}

/* COLOUR DOT */
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;flex-shrink:0}

/* FOOTER */
.footer{text-align:center;padding:16px;font-size:10px;color:#2A3460;border-top:1px solid var(--border)}
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <div class="brand"><span>DIRIS</span>DIGIWARE</div>
    <span style="color:var(--border)">|</span>
    <span style="font-size:12px;color:var(--muted)">Breaker Comparison</span>
  </div>
  <div class="topbar-r">
    <div class="co-pill" id="coPill">—</div>
    <a href="dashboard.html" class="nav-btn">⚡ Dashboard</a>
    <a href="production.html" class="nav-btn">🏭 Production</a>
    <button class="nav-btn" onclick="logout()">Sign Out</button>
  </div>
</div>

<div class="controls">
  <span class="ctrl-lbl">From</span>
  <input type="date" class="dt" id="fromDate">
  <span class="ctrl-lbl">To</span>
  <input type="date" class="dt" id="toDate">
  <div class="sep"></div>
  <button class="pb active" onclick="setP('month',this)">This Month</button>
  <button class="pb" onclick="setP('week',this)">This Week</button>
  <button class="pb" onclick="setP('alltime',this)">All Time</button>
  <div class="sep"></div>
  <span class="ctrl-lbl">Group By</span>
  <select class="grp-sel" id="groupBy">
    <option value="daily">Daily</option>
    <option value="weekly">Weekly</option>
    <option value="monthly">Monthly</option>
  </select>
  <div class="sep"></div>
  <button class="btn-load" onclick="loadData()">Load Data</button>
</div>

<div class="main" id="main">
  <div class="loading">Loading comparison data...</div>
</div>

<div class="footer">
  Dirisdigiware — Breaker Comparison &nbsp;·&nbsp; Developed by Thirasha Bandara &nbsp;·&nbsp; Venora Lanka Power Panels (Pvt) Ltd
</div>

<script>
const API = 'https://venora-cloud-server-production.up.railway.app';
let user = null;
let charts = {};

// 8 distinct colours for breakers
const COLORS = [
  '#00C8D4','#C9A347','#E05555','#4CAF7D',
  '#8B6FE8','#E8924F','#E86FA8','#4F9EE8'
];
function colAlpha(hex, a) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ── AUTH ──────────────────────────────────────────────────────────────────────
function checkAuth(){
  const s=sessionStorage.getItem('user');
  if(!s){window.location.href='login.html';return false;}
  user=JSON.parse(s);
  document.getElementById('coPill').textContent=user.company||user.site_name||'Site '+user.site_id;
  return true;
}
function logout(){sessionStorage.removeItem('user');window.location.href='login.html';}

// ── DATE PRESETS ──────────────────────────────────────────────────────────────
function setP(preset, btn){
  document.querySelectorAll('.pb').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const now=new Date();
  let from,to=now.toISOString().split('T')[0];
  if(preset==='week'){from=new Date(now-7*86400000).toISOString().split('T')[0];}
  else if(preset==='month'){from=new Date(now.getFullYear(),now.getMonth(),1).toISOString().split('T')[0];}
  else if(preset==='alltime'){from='2020-01-01';}
  document.getElementById('fromDate').value=from;
  document.getElementById('toDate').value=to;
}

// ── LOAD DATA ─────────────────────────────────────────────────────────────────
async function loadData(){
  const siteId=user.site_id;
  const from=document.getElementById('fromDate').value;
  const to=document.getElementById('toDate').value;
  const groupBy=document.getElementById('groupBy').value;
  if(!from||!to){alert('Please select date range.');return;}

  document.getElementById('main').innerHTML='<div class="loading">⏳ Loading data...</div>';
  Object.values(charts).forEach(c=>c.destroy());
  charts={};

  try{
    const token=(JSON.parse(sessionStorage.getItem('user')||'{}')).token||'';
    const resp=await fetch(`${API}/api/analytics/breaker-comparison?site_id=${siteId}&from=${from}&to=${to}&group_by=${groupBy}`,{
      headers:{Authorization:'Bearer '+token}
    });
    const data=await resp.json();
    if(!resp.ok) throw new Error(data.error||'Failed to load');
    render(data, groupBy);
  }catch(e){
    document.getElementById('main').innerHTML=`<div class="loading">❌ Error: ${e.message}</div>`;
  }
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(data, groupBy){
  const {periods, breakers, period_data, breaker_totals} = data;

  // Only show the 8 target breakers — filter others
  const TARGET = ['250A BREAKER','2T BOILER & A_C','DBPP','DBPRO1','DBPRO2','DBRM','MACHINE 38_43.1_43.2_43.3','MACHINE 40'];
  const showBreakers = breakers.filter(b => TARGET.includes(b) || TARGET.length===0);

  // Format period labels
  const labels = periods.map(p=>{
    const d=new Date(p);
    if(groupBy==='daily')   return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
    if(groupBy==='weekly')  return 'W/C '+d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
    if(groupBy==='monthly') return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'});
    return d.toLocaleDateString();
  });

  // Build datasets
  const kwhDatasets = showBreakers.map((b,i)=>({
    label: b,
    data:  periods.map(p=>(period_data[p]&&period_data[p][b])?period_data[p][b].kwh:0),
    backgroundColor: colAlpha(COLORS[i%COLORS.length],.75),
    borderColor:     COLORS[i%COLORS.length],
    borderWidth: 1, borderRadius: 3, borderSkipped: false
  }));

  const costDatasets = showBreakers.map((b,i)=>({
    label: b,
    data:  periods.map(p=>(period_data[p]&&period_data[p][b])?period_data[p][b].cost:0),
    backgroundColor: colAlpha(COLORS[i%COLORS.length],.75),
    borderColor:     COLORS[i%COLORS.length],
    borderWidth: 1, borderRadius: 3, borderSkipped: false
  }));

  const kwhLineDatasets = showBreakers.map((b,i)=>({
    label: b,
    data:  periods.map(p=>(period_data[p]&&period_data[p][b])?period_data[p][b].kwh:0),
    borderColor:     COLORS[i%COLORS.length],
    backgroundColor: colAlpha(COLORS[i%COLORS.length],.08),
    borderWidth: 2, pointRadius: 3, pointHoverRadius: 5,
    tension: 0.35, fill: false
  }));

  const costLineDatasets = showBreakers.map((b,i)=>({
    label: b,
    data:  periods.map(p=>(period_data[p]&&period_data[p][b])?period_data[p][b].cost:0),
    borderColor:     COLORS[i%COLORS.length],
    backgroundColor: colAlpha(COLORS[i%COLORS.length],.08),
    borderWidth: 2, pointRadius: 3, pointHoverRadius: 5,
    tension: 0.35, fill: false
  }));

  // KPI totals
  const totalKwh  = showBreakers.reduce((s,b)=>s+(breaker_totals[b]?.kwh||0),0);
  const totalCost = showBreakers.reduce((s,b)=>s+(breaker_totals[b]?.cost||0),0);
  const topBreaker= showBreakers.reduce((top,b)=>(breaker_totals[b]?.kwh||0)>(breaker_totals[top]?.kwh||0)?b:top, showBreakers[0]||'—');

  // Sorted table data
  const sorted=[...showBreakers].sort((a,b)=>(breaker_totals[b]?.kwh||0)-(breaker_totals[a]?.kwh||0));

  // Chart options
  const chartOpts = (ylabel, prefix='', isCost=false) => ({
    responsive:true, maintainAspectRatio:false,
    plugins:{
      legend:{display:true,position:'top',labels:{color:'rgba(255,255,255,.45)',font:{size:9},padding:10,boxWidth:8,usePointStyle:true}},
      tooltip:{backgroundColor:'#0E1220',borderColor:'rgba(0,200,212,.2)',borderWidth:1,cornerRadius:3,
        titleColor:'#00C8D4',bodyColor:'rgba(255,255,255,.65)',padding:10,
        callbacks:{label:ctx=>`${ctx.dataset.label}: ${prefix}${isCost?ctx.raw.toLocaleString():ctx.raw.toFixed(1)} ${ylabel}`}}
    },
    scales:{
      x:{grid:{display:false},ticks:{color:'rgba(255,255,255,.2)',font:{size:9},maxRotation:45}},
      y:{grid:{color:'rgba(0,200,212,.05)'},ticks:{color:'rgba(255,255,255,.2)',font:{size:9},
        callback:v=>isCost?'LKR '+v.toLocaleString():v+' kWh'}}
    }
  });

  // Build HTML
  const main = document.getElementById('main');
  main.innerHTML = `
    <!-- KPI ROW -->
    <div class="kpi-row" id="kpiRow"></div>

    <!-- BAR CHARTS -->
    <div class="chart-row">
      <div class="chart-card">
        <div class="chart-title">Daily Energy Consumption</div>
        <div class="chart-sub">kWh per breaker — side by side</div>
        <div class="chart-wrap"><canvas id="kwhBar"></canvas></div>
      </div>
      <div class="chart-card" style="--teal:var(--gold)">
        <div class="chart-title" style="color:var(--gold)">Daily Cost (LKR)</div>
        <div class="chart-sub">Lanka Electricity Company tariff cost per breaker</div>
        <div class="chart-wrap"><canvas id="costBar"></canvas></div>
      </div>
    </div>

    <!-- LINE CHARTS -->
    <div class="chart-row">
      <div class="chart-card">
        <div class="chart-title">Energy Trend</div>
        <div class="chart-sub">kWh consumption over time per breaker</div>
        <div class="chart-wrap"><canvas id="kwhLine"></canvas></div>
      </div>
      <div class="chart-card" style="--teal:var(--gold)">
        <div class="chart-title" style="color:var(--gold)">Cost Trend (LKR)</div>
        <div class="chart-sub">Cost over time per breaker</div>
        <div class="chart-wrap"><canvas id="costLine"></canvas></div>
      </div>
    </div>

    <!-- TABLE -->
    <div class="tbl-card" style="position:relative">
      <div class="tbl-title">Breaker Summary — Total for Selected Period</div>
      <table>
        <thead>
          <tr>
            <th>Breaker / Load</th>
            <th>Total kWh</th>
            <th>Total Cost (LKR)</th>
            <th>% of Total</th>
            <th>Consumption Share</th>
          </tr>
        </thead>
        <tbody id="tblBody"></tbody>
      </table>
    </div>
  `;

  // KPI cards
  const kpiRow=document.getElementById('kpiRow');
  const kpis=[
    {label:'Total Consumption',val:totalKwh.toFixed(0)+' kWh',sub:'All breakers combined',color:'var(--teal)'},
    {label:'Total Cost',val:'LKR '+Math.round(totalCost).toLocaleString(),sub:'LEC tariff calculated',color:'var(--gold)'},
    {label:'Highest Consumer',val:topBreaker,sub:(breaker_totals[topBreaker]?.kwh||0).toFixed(0)+' kWh',color:'var(--red)'},
    {label:'Breakers Analysed',val:showBreakers.length,sub:'Active load points',color:'var(--green)'},
    {label:'Periods',val:periods.length,sub:groupBy+' data points',color:'var(--purple)'},
  ];
  kpis.forEach((k,i)=>{
    const div=document.createElement('div');
    div.className='kpi';
    div.style.setProperty('--c',k.color);
    div.innerHTML=`<style>.kpi:nth-child(${i+1})::before{background:${k.color}}</style>
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-val" style="color:${k.color}">${k.val}</div>
      <div class="kpi-sub">${k.sub}</div>`;
    kpiRow.appendChild(div);
  });

  // Table
  const tbody=document.getElementById('tblBody');
  sorted.forEach((b,i)=>{
    const kwh=breaker_totals[b]?.kwh||0;
    const cost=breaker_totals[b]?.cost||0;
    const pct=totalKwh>0?(kwh/totalKwh*100).toFixed(1):0;
    const color=COLORS[showBreakers.indexOf(b)%COLORS.length];
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td class="td-name"><span class="dot" style="background:${color}"></span>${b}</td>
      <td class="td-kwh">${kwh.toFixed(1)} kWh</td>
      <td class="td-cost">LKR ${Math.round(cost).toLocaleString()}</td>
      <td class="td-pct">${pct}%</td>
      <td style="width:120px"><div class="bar-mini"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div></td>`;
    tbody.appendChild(tr);
  });

  // Charts
  const cfg = (type,datasets,opts)=>({type,data:{labels,datasets},options:opts});
  charts.kwhBar  = new Chart(document.getElementById('kwhBar'),  cfg('bar',  kwhDatasets,  chartOpts('kWh','',false)));
  charts.costBar = new Chart(document.getElementById('costBar'), cfg('bar',  costDatasets, chartOpts('LKR','LKR ',true)));
  charts.kwhLine = new Chart(document.getElementById('kwhLine'), cfg('line', kwhLineDatasets, chartOpts('kWh','',false)));
  charts.costLine= new Chart(document.getElementById('costLine'),cfg('line', costLineDatasets,chartOpts('LKR','LKR ',true)));
}

// ── INIT ──────────────────────────────────────────────────────────────────────
if(checkAuth()){
  // Default: all time for S&D data (Nov 2025)
  document.getElementById('fromDate').value='2025-11-01';
  document.getElementById('toDate').value='2025-11-30';
  document.getElementById('groupBy').value='daily';
  loadData();
}
</script>
</body>
</html>
